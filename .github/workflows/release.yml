name: Release & Publish with Changesets

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  attestations: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'Tixyel/widgets'
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'

      - name: Update npm for OIDC trusted publishing
        run: |
          # npm trusted publishing requires npm >= 11.5.1
          # Node.js 22.x ships with npm 10.x, so we need to update
          echo "Current npm version: $(npm --version)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm --version)"

      # Install root dependencies
      - name: Install dependencies (root)
        run: npm ci
        working-directory: ${{ github.workspace }}

      # Create Release Pull Request or Publish to npm
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ''
